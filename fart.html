<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stream Overlay</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      background: transparent !important;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    /* THEME VARIABLES (DYNAMIC PER LOGO) */
    :root {
      --speed-mult: 1;
      --glow-color: #00d2ff;
      --glow-secondary: #0066ff;
      --glow-bright: #38bdf8;
      --rail-bg: rgba(0, 210, 255, 0.9);
      --sheen-tint: rgba(130, 235, 255, 0.9);
      --glow-spread: 28px;
    }

    /* THEME: RUBEM (CRIMSON RED & PURE WHITE) */
    body.theme-rubem {
      --glow-color: #ff1e44;
      --glow-secondary: #ff0033;
      --glow-bright: #ffffff;
      --rail-bg: rgba(255, 30, 68, 0.9);
      --sheen-tint: rgba(255, 100, 120, 0.9);
      --glow-spread: 32px;
    }

    /* THEME: FART TOGETHER (TOXIC LIME & COMIC ORANGE) */
    body.theme-fart {
      --glow-color: #39ff14;
      --glow-secondary: #ff6b00;
      --glow-bright: #e6ff00;
      --rail-bg: rgba(57, 255, 20, 0.9);
      --sheen-tint: rgba(230, 255, 0, 0.9);
      --glow-spread: 30px;
    }

    .viewport {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
    }

    /* =======================================================
       LAYOUT 2: MIDDLE DIVIDER BAR (Laser Rails)
       ======================================================= */
    .divider-bar {
      display: none;
      width: 100%;
      max-width: 1100px;
      align-items: center;
      justify-content: center;
      padding: 0 10px;
      position: relative;
    }
    body.layout-divider .divider-bar {
      display: flex;
    }

    .rail {
      position: relative;
      flex: 1;
      height: 3px;
      overflow: visible;
    }
    .rail.left {
      background: linear-gradient(90deg, transparent 0%, rgba(255, 255, 255, 0.2) 20%, var(--rail-bg) 85%, #ffffff 100%);
      box-shadow: 0 0 12px var(--glow-color), 0 0 24px var(--glow-secondary);
    }
    .rail.right {
      background: linear-gradient(270deg, transparent 0%, rgba(255, 255, 255, 0.2) 20%, var(--rail-bg) 85%, #ffffff 100%);
      box-shadow: 0 0 12px var(--glow-color), 0 0 24px var(--glow-secondary);
    }
    .rail-beam {
      position: absolute;
      top: -3px;
      width: 70px;
      height: 9px;
      border-radius: 999px;
      background: linear-gradient(90deg, transparent, #ffffff, var(--glow-bright), transparent);
      filter: blur(1px);
    }
    .rail.left .rail-beam { animation: shootLeft 3.2s ease-in-out infinite; }
    .rail.right .rail-beam { animation: shootRight 3.2s ease-in-out infinite; }
    @keyframes shootLeft {
      0% { left: 0%; opacity: 0; }
      20% { opacity: 1; }
      80% { opacity: 1; }
      100% { left: calc(100% - 70px); opacity: 0; }
    }
    @keyframes shootRight {
      0% { right: 0%; opacity: 0; }
      20% { opacity: 1; }
      80% { opacity: 1; }
      100% { right: calc(100% - 70px); opacity: 0; }
    }
    .rail-diamond {
      position: absolute;
      top: 50%;
      transform: translateY(-50%) rotate(45deg);
      width: 8px;
      height: 8px;
      background: #ffffff;
      box-shadow: 0 0 10px #ffffff, 0 0 18px var(--glow-color);
    }
    .rail.left .rail-diamond { right: 4px; }
    .rail.right .rail-diamond { left: 4px; }

    /* =======================================================
       LAYOUT 3: CYBER GAMING HUD BRACKETS
       ======================================================= */
    .hud-box {
      position: relative;
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      padding: 10px 18px;
    }
    body.layout-hud .hud-box {
      background: rgba(4, 14, 28, 0.6);
      border: 1px solid var(--glow-color);
      border-radius: 14px;
      box-shadow: inset 0 0 22px rgba(0, 0, 0, 0.5), 0 8px 30px rgba(0, 0, 0, 0.85);
    }
    .hud-corner {
      display: none;
      position: absolute;
      width: 14px;
      height: 14px;
      border-color: var(--glow-color);
      border-style: solid;
    }
    body.layout-hud .hud-corner { display: block; }
    .hud-tl { top: -2px; left: -2px; border-width: 2px 0 0 2px; }
    .hud-tr { top: -2px; right: -2px; border-width: 2px 2px 0 0; }
    .hud-bl { bottom: -2px; left: -2px; border-width: 0 0 2px 2px; }
    .hud-br { bottom: -2px; right: -2px; border-width: 0 2px 2px 0; }

    .hud-badge {
      display: none;
      margin-top: -4px;
      padding: 3px 14px;
      background: rgba(0, 0, 0, 0.7);
      border: 1px solid var(--glow-color);
      border-radius: 999px;
      color: var(--glow-bright);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      gap: 6px;
      align-items: center;
    }
    body.layout-hud .hud-badge { display: inline-flex; }

    /* =======================================================
       LOGO CONTAINER & MASKING
       ======================================================= */
    .logo-container {
      position: relative;
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 90vw;
      max-width: 900px;
      transform-origin: center center;
    }
    body.layout-divider .logo-container {
      width: 480px;
      max-width: 78vw;
      margin: 0 16px;
    }
    body.layout-hud .logo-container {
      width: 500px;
      max-width: 82vw;
    }

    .logo-img {
      width: 100%;
      height: auto;
      display: block;
      user-select: none;
      -webkit-user-drag: none;
    }

    /* MASK LAYER */
    .sheen-mask {
      position: absolute;
      inset: 0;
      -webkit-mask-size: contain;
      mask-size: contain;
      -webkit-mask-repeat: no-repeat;
      -webkit-mask-position: center;
      pointer-events: none;
      mix-blend-mode: color-dodge;
      overflow: hidden;
      z-index: 2;
    }

    /* Set mask image per logo */
    body.logo-habesha .sheen-mask { -webkit-mask-image: url('logo.png'); mask-image: url('logo.png'); }
    body.logo-rubem .sheen-mask { -webkit-mask-image: url('rubem.png'); mask-image: url('rubem.png'); }
    body.logo-fart .sheen-mask { -webkit-mask-image: url('fart.png'); mask-image: url('fart.png'); }

    /* =======================================================
       THE 5 ANIMATION STYLES
       ======================================================= */

    /* STYLE 1: DIAMOND CHROME */
    .anim-diamond .logo-container {
      animation: floatSmooth calc(3.5s * var(--speed-mult)) ease-in-out infinite;
      filter: drop-shadow(0 0 16px var(--glow-color))
              drop-shadow(0 0 var(--glow-spread) var(--glow-secondary));
    }
    .anim-diamond .sheen-mask::after {
      content: '';
      position: absolute;
      top: -60%;
      left: -120%;
      width: 45%;
      height: 220%;
      background: linear-gradient(
        112deg,
        rgba(255, 255, 255, 0) 0%,
        rgba(255, 255, 255, 0.25) 20%,
        rgba(255, 255, 255, 1) 50%,
        var(--sheen-tint) 65%,
        rgba(255, 255, 255, 0) 100%
      );
      transform: rotate(26deg);
      filter: blur(1.5px);
      animation: sweepMove calc(3.5s * var(--speed-mult)) cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }

    /* STYLE 2: ELECTRIC PULSE */
    .anim-pulse .logo-container {
      animation: electricHeartbeat calc(2.2s * var(--speed-mult)) ease-in-out infinite;
    }
    @keyframes electricHeartbeat {
      0%, 100% {
        transform: scale(1);
        filter: drop-shadow(0 0 12px var(--glow-color)) drop-shadow(0 0 25px var(--glow-secondary));
      }
      35% {
        transform: scale(1.04);
        filter: drop-shadow(0 0 35px var(--glow-bright)) drop-shadow(0 0 70px var(--glow-color)) drop-shadow(0 0 100px var(--glow-secondary));
      }
      50% {
        transform: scale(1.01);
        filter: drop-shadow(0 0 20px var(--glow-color)) drop-shadow(0 0 40px var(--glow-secondary));
      }
      65% {
        transform: scale(1.03);
        filter: drop-shadow(0 0 30px var(--glow-bright)) drop-shadow(0 0 60px var(--glow-color));
      }
    }
    .anim-pulse .sheen-mask::after {
      content: '';
      position: absolute;
      top: -50%;
      left: -100%;
      width: 50%;
      height: 200%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.95), var(--glow-bright), transparent);
      transform: rotate(20deg);
      animation: sweepMove calc(2.2s * var(--speed-mult)) ease-in-out infinite;
    }

    /* STYLE 3: LIQUID CHROME WAVE */
    .anim-wave .logo-container {
      animation: floatSmooth calc(4s * var(--speed-mult)) ease-in-out infinite;
      filter: drop-shadow(0 0 18px var(--glow-color)) drop-shadow(0 0 40px var(--glow-secondary));
    }
    .anim-wave .sheen-mask::after {
      content: '';
      position: absolute;
      inset: -100%;
      background: repeating-linear-gradient(
        115deg,
        rgba(255, 255, 255, 0) 0%,
        rgba(255, 255, 255, 0.3) 10%,
        var(--sheen-tint) 18%,
        rgba(255, 255, 255, 0.9) 25%,
        rgba(255, 255, 255, 0) 35%
      );
      background-size: 200% 200%;
      animation: waveContinuous calc(3.8s * var(--speed-mult)) linear infinite;
    }
    @keyframes waveContinuous {
      0% { transform: translateX(-40%) translateY(-20%); }
      100% { transform: translateX(20%) translateY(10%); }
    }

    /* STYLE 4: CYBER GLITCH */
    .anim-glitch .logo-container {
      animation: cyberGlitch calc(3.2s * var(--speed-mult)) infinite;
    }
    @keyframes cyberGlitch {
      0%, 88%, 94%, 100% {
        transform: translate(0, 0) skewX(0deg);
        filter: drop-shadow(0 0 16px var(--glow-color)) drop-shadow(0 0 35px var(--glow-secondary));
      }
      89% {
        transform: translate(-5px, 2px) skewX(3deg);
        filter: drop-shadow(-4px 0 0 #00ffff) drop-shadow(4px 0 0 #ff0055) drop-shadow(0 0 25px var(--glow-color));
      }
      90% {
        transform: translate(4px, -2px) skewX(-2deg);
        filter: drop-shadow(4px 0 0 #00ffff) drop-shadow(-4px 0 0 #ff0055);
      }
      91% {
        transform: translate(-2px, 1px);
        filter: drop-shadow(0 0 35px #ffffff);
      }
      92% {
        transform: translate(2px, -1px);
      }
    }
    .anim-glitch .sheen-mask::after {
      content: '';
      position: absolute;
      top: -50%;
      left: -100%;
      width: 40%;
      height: 200%;
      background: linear-gradient(110deg, transparent, rgba(255, 255, 255, 1), var(--glow-bright), transparent);
      transform: rotate(25deg);
      animation: sweepMove calc(2.4s * var(--speed-mult)) cubic-bezier(0.2, 0.8, 0.2, 1) infinite;
    }

    /* STYLE 5: ZENITH MINIMAL */
    .anim-zenith .logo-container {
      filter: drop-shadow(0 0 14px var(--glow-color)) drop-shadow(0 0 30px var(--glow-secondary));
    }
    .anim-zenith .sheen-mask::after {
      content: '';
      position: absolute;
      top: -60%;
      left: -120%;
      width: 35%;
      height: 220%;
      background: linear-gradient(
        110deg,
        rgba(255, 255, 255, 0) 0%,
        rgba(255, 255, 255, 0.4) 40%,
        rgba(255, 255, 255, 0.95) 50%,
        rgba(255, 255, 255, 0) 70%
      );
      transform: rotate(24deg);
      filter: blur(2px);
      animation: sweepMove calc(6s * var(--speed-mult)) cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }

    /* COMMON ANIMATIONS */
    @keyframes sweepMove {
      0% { left: -120%; opacity: 0; }
      10% { opacity: 1; }
      50% { left: 150%; opacity: 1; }
      51%, 100% { left: 150%; opacity: 0; }
    }
    @keyframes floatSmooth {
      0%, 100% { transform: translateY(0px) scale(1); }
      50% { transform: translateY(-7px) scale(1.015); }
    }

    body.no-float .logo-container {
      animation-name: none !important;
      transform: none !important;
    }

    /* STARBURST GLINTS */
    .glint {
      display: none;
      position: absolute;
      width: 24px;
      height: 24px;
      pointer-events: none;
      z-index: 5;
    }
    .anim-diamond .glint, .anim-pulse .glint, .anim-glitch .glint {
      display: block;
    }
    .glint::before, .glint::after {
      content: '';
      position: absolute;
      background: #ffffff;
      border-radius: 999px;
      box-shadow: 0 0 10px #ffffff, 0 0 20px var(--glow-color), 0 0 35px var(--glow-secondary);
    }
    .glint::before {
      top: 50%;
      left: 0;
      width: 100%;
      height: 3px;
      transform: translateY(-50%);
    }
    .glint::after {
      top: 0;
      left: 50%;
      width: 3px;
      height: 100%;
      transform: translateX(-50%);
    }

    .glint-1 { top: 35%; left: 18%; animation: glintPop calc(3.5s * var(--speed-mult)) infinite 0.45s; }
    .glint-2 { top: 25%; left: 50%; animation: glintPop calc(3.5s * var(--speed-mult)) infinite 0.95s; }
    .glint-3 { top: 35%; right: 18%; animation: glintPop calc(3.5s * var(--speed-mult)) infinite 1.45s; }

    @keyframes glintPop {
      0%, 80%, 100% { transform: scale(0) rotate(0deg); opacity: 0; }
      85% { transform: scale(1.4) rotate(45deg); opacity: 1; }
      90% { transform: scale(0.9) rotate(90deg); opacity: 0.85; }
      96% { transform: scale(0) rotate(135deg); opacity: 0; }
    }
  </style>
</head>
<body class="logo-habesha theme-habesha layout-logo anim-diamond">
  <div class="viewport">
    
    <!-- LAYOUT 2: DIVIDER BAR -->
    <div class="divider-bar">
      <div class="rail left">
        <div class="rail-beam"></div>
        <div class="rail-diamond"></div>
      </div>

      <div class="logo-container" id="logo-box">
        <img src="logo.png" alt="Stream Logo" class="logo-img" id="img-divider">
        <div class="sheen-mask"></div>
        <div class="glint glint-1"></div>
        <div class="glint glint-2"></div>
        <div class="glint glint-3"></div>
      </div>

      <div class="rail right">
        <div class="rail-beam"></div>
        <div class="rail-diamond"></div>
      </div>
    </div>

    <!-- LAYOUT 1 & 3: PURE LOGO / HUD -->
    <div class="hud-box" id="hud-wrapper">
      <div class="hud-corner hud-tl"></div>
      <div class="hud-corner hud-tr"></div>
      <div class="hud-corner hud-bl"></div>
      <div class="hud-corner hud-br"></div>

      <div class="logo-container" id="main-logo-box">
        <img src="logo.png" alt="Stream Logo" class="logo-img" id="img-main">
        <div class="sheen-mask"></div>
        <div class="glint glint-1"></div>
        <div class="glint glint-2"></div>
        <div class="glint glint-3"></div>
      </div>

      <div class="hud-badge" id="hud-badge-el">
        <span style="display:inline-block; width:6px; height:6px; background:var(--glow-bright); border-radius:50%; box-shadow:0 0 6px var(--glow-bright);"></span>
        <span id="hud-text">HABESHA ROLEPLAY</span>
      </div>
    </div>

  </div>

  <script>
    const params = new URLSearchParams(window.location.search);

    // 1. SELECT LOGO: habesha (default), rubem, fart
    const logoParam = (params.get('logo') || 'fart').toLowerCase();
    let logoSrc = 'logo.png';
    let hudLabel = 'HABESHA ROLEPLAY';

    if (logoParam === 'rubem') {
      logoSrc = 'rubem.png';
      hudLabel = 'RUBEM ESPORTS';
      document.body.classList.remove('logo-habesha', 'theme-habesha');
      document.body.classList.add('logo-rubem', 'theme-rubem');
    } else if (logoParam === 'fart') {
      logoSrc = 'fart.png';
      hudLabel = 'FART TOGETHER';
      document.body.classList.remove('logo-habesha', 'theme-habesha');
      document.body.classList.add('logo-fart', 'theme-fart');
    } else {
      document.body.classList.add('logo-habesha', 'theme-habesha');
    }

    document.getElementById('img-divider').src = logoSrc;
    document.getElementById('img-main').src = logoSrc;
    document.getElementById('hud-text').textContent = hudLabel;

    // 2. LAYOUT: logo (default), divider, hud
    const layout = params.get('layout') || 'logo';
    document.body.classList.add('layout-' + layout);

    if (layout === 'divider') {
      document.getElementById('hud-wrapper').style.display = 'none';
      document.querySelector('.divider-bar').style.display = 'flex';
    } else {
      document.querySelector('.divider-bar').style.display = 'none';
      document.getElementById('hud-wrapper').style.display = 'inline-flex';
    }

    // 3. ANIMATION STYLE: diamond (default), pulse, wave, glitch, zenith
    const style = params.get('style') || 'diamond';
    document.body.classList.add('anim-' + style);

    // 4. FLOAT: true (default) or false
    if (params.get('float') === 'false') {
      document.body.classList.add('no-float');
    }

    // 5. SPEED: normal, fast, slow
    const speed = params.get('speed');
    if (speed === 'fast') {
      document.documentElement.style.setProperty('--speed-mult', '0.65');
    } else if (speed === 'slow') {
      document.documentElement.style.setProperty('--speed-mult', '1.5');
    }

    // 6. GLOW INTENSITY
    const glow = params.get('glow');
    if (glow === 'hyper') {
      document.documentElement.style.setProperty('--glow-spread', '50px');
    } else if (glow === 'subtle') {
      document.documentElement.style.setProperty('--glow-spread', '14px');
    }
  </script>
</body>
</html>
